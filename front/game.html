<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jogo da Velha dos Gatos 🐾</title>
  <link rel="icon" type="image/x-icon" href="assets/icon.png" />
  <link rel="stylesheet" href="styleDarkTech.css" />

  <style>

    body {
  padding-top: 60px; /* Espaço no topo */
  box-sizing: border-box;
}

    .loader {
      font-size: 2rem;
      color: #00CFFF;
      text-shadow: 0 0 8px #00CFFF;
      animation: pulse 1s infinite alternate;
      margin-top: 30vh;
      text-align: center;
    }

    @keyframes pulse {
      from { opacity: 0.3; }
      to   { opacity: 1; }
    }

    #menu, #game {
      display: none;
    }
.placar-wrapper {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 30px;
  flex-wrap: wrap;
  margin-bottom: 15px;
  width: 100%;
  max-width: 600px;
}

.placar {
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 1.1rem;
}

#mensagem {
  flex: 1;
  color: #f9a825;
  font-weight: bold;
  text-shadow: 0 0 6px #f9a825aa;
  min-width: 150px;
  text-align: right;
}

.tabuleiro {
  display: grid;
  grid-template-columns: repeat(3, 100px);
  grid-gap: 10px;
  justify-content: center;
  margin: 20px 0;
}

.tabuleiro .cell {
  width: 100px;
  height: 100px;
 background: #ffffff;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 2.5rem;
  border: 2px solid #00CFFF;
  border-radius: 12px;
  cursor: pointer;
  box-shadow: 0 0 6px #00cfffaa inset;
  transition: background-color 0.3s ease;
}

.tabuleiro .cell.disabled {
  pointer-events: none;
  opacity: 0.6;
   background-color: #111;
  color: #004455;
  cursor: default;
  box-shadow: none;
}
.tabuleiro .cell:hover {
  background-color: #005f7f;
}

  </style>
</head>
<body>

  <div id="loader" class="loader">⌛ Carregando...</div>

  <div id="menu">
    <h1>🐾 Jogo da Velha dos Gatos 🐾</h1>
    <input type="text" id="nomeX" placeholder="Nome do Oponente" />

    <button onclick="startGame()">Começar</button>
    <br><br>
    <button onclick="window.location.href='home.html'">🔙 Voltar ao Menu</button>
  </div>


  <div id="game">
  <div class="placar-wrapper">
    <div class="placar">
      <div><span id="nomeDisplayX">𓃠 Gato 1</span></div>
      <div><span id="nomeDisplayO">🐈‍⬛ Gato 2</span></div>
    </div>
    <div id="mensagem">⌛ Aguardando...</div>
  </div>


    <div class="tabuleiro" id="tabuleiro">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>
    
    <button id="btnNextRound" onclick="nextRound()" disabled>Próxima Rodada</button>
    <button onclick="endGame()" style="margin-top:10px; background:#f44336; color:#fff;">Encerrar Jogo</button>
  </div>


  <script>
    function getToken() { return localStorage.getItem('authToken'); }
    const API_BASE_URL = 'https://tictactoe-ed8r.onrender.com/api';

    let currentPlayer = null;
    let currentGameId = null;
    let gameActive = false;
    let playerNames = { X: null, O: null };

    const loader       = document.getElementById('loader');
    const menu         = document.getElementById('menu');
    const gameSection  = document.getElementById('game-section');
    const cells        = document.querySelectorAll('.cell');
    const gameStatus   = document.getElementById('game-status');
    const opponentInput= document.getElementById('opponent');
    const btnStart     = document.getElementById('btn-start-game');
    const btnLoad      = document.getElementById('btn-load-games');
    const btnNext      = document.getElementById('btn-next-round');

    setTimeout(() => {
      loader.style.display = 'none';
      menu.style.display = 'block';
    }, 2500);

    btnStart.onclick = startNewGame;
    btnNext?.addEventListener('click', () => loadGame(currentGameId));

    function startNewGame() {
      const opponent = opponentInput.value.trim();
      if (!opponent) return alert('Informe o nome do oponente');
      fetch(`${API_BASE_URL}/games/start?opponentUsername=${opponent}`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${getToken()}` }
      })
      .then(res => res.json())
      .then(data => {
        currentGameId = data.gameId;
        currentPlayer = data.currentPlayer;
        setupGame(data.board);
      })
      .catch(console.error);
    }

    function loadGame(gameId) {
      fetch(`${API_BASE_URL}/games/${gameId}`, {
        headers: { 'Authorization': `Bearer ${getToken()}` }
      })
      .then(res => res.json())
      .then(game => {
        currentGameId = game.id;
        currentPlayer = (game.playerX === localStorage.getItem('username')) ? 'X' : 'O';
        setupGame(game.boardState);
      })
      .catch(console.error);
    }

    function setupGame(boardState) {
      menu.style.display = 'none';
      gameSection.style.display = 'block';
      playerNames.X = localStorage.getItem('username');
      playerNames.O = opponentInput.value.trim();
      gameStatus.textContent = `É a vez de ${currentPlayer}`;
      initBoard(boardState);
    }

    function initBoard(boardState) {
      gameActive = true;
      const arr = Array.isArray(boardState) ?
                  boardState :
                  String(boardState).padEnd(9).split('');
      cells.forEach((cell, i) => {
        cell.textContent = arr[i] === 'X' ? '🐱' : arr[i] === 'O' ? '🐈' : '';
        cell.classList.remove('disabled', 'x', 'o');
        if (arr[i] === 'X') cell.classList.add('x');
        if (arr[i] === 'O') cell.classList.add('o');
        cell.onclick = () => makeMove(i);
      });
    }

    function makeMove(position) {
      if (!gameActive) return;
      fetch(`${API_BASE_URL}/games/${currentGameId}/move`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${getToken()}`
        },
        body: JSON.stringify({ position })
      })
      .then(res => res.json())
      .then(data => {
        initBoard(data.board);
        if (data.gameOver) {
          gameActive = false;
          gameStatus.textContent = data.winner ? `Vencedor: ${data.winner}` : 'Empate!';
        } else {
          currentPlayer = data.currentPlayer;
          gameStatus.textContent = `É a vez de ${currentPlayer}`;
        }
      })
      .catch(console.error);
    }
  </script>

</body>
</html>
